<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Translator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .upload-box {
            border: 2px dashed #3b82f6;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 16px;
            background: #0f172a;
            display: block;
        }
        input[type="file"] {
            display: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0369a1;
        }
        /* Loading & Progress Bar Style */
        #loadingScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #334155;
            border-radius: 8px;
            overflow: hidden;
            height: 12px;
            margin: 20px 0 10px 0;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #38bdf8;
            transition: width 0.5s ease-in-out;
        }
        #statusText {
            font-size: 13px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h2>🎬 បកប្រែវីដេអូ AI</h2>
        <p>Upload វីដេអូ (១ ដល់ ៦ នាទី) ដើម្បីបកប្រែជាសំឡេង AI ភាសាខ្មែរ</p>

        <form id="uploadForm" action="/process" method="POST" enctype="multipart/form-data">
            <label class="upload-box" for="videoFile">
                <span id="fileName">📁 ចុចទីនេះដើម្បីជ្រើសរើសវីដេអូ</span>
                <input type="file" id="videoFile" name="video" accept="video/*" required onchange="showFileName(this)">
            </label>
            <button type="submit" id="submitBtn">ចាប់ផ្តើមបកប្រែ</button>
        </form>
    </div>

    <!-- អេក្រង់រង់ចាំជាមួយ Progress Bar ចន្លោះ ២ ដល់ ៣ នាទី -->
    <div class="container" id="loadingScreen">
        <h2>⏳ កំពុងដំណើរការបកប្រែ...</h2>
        <p>ប្រព័ន្ធកំពុងទាញយកសំឡេង បកប្រែ និងបង្កើតសំឡេង AI ភាសាខ្មែរជូនលោកអ្នក។</p>
        
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div id="statusText">0% (រង់ចាំប្រហែល ២-៣ នាទី)</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function showFileName(input) {
            if (input.files && input.files[0]) {
                document.getElementById('fileName').innerText = "📄 " + input.files[0].name;
            }
        }

        document.getElementById('uploadForm').onsubmit = function(e) {
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'flex';

            // จำลองการวิ่งของ Progress Bar ภายในเวลาประมาณ 2.5 นาที (150 วินาที)
            let width = 0;
            let progressBar = document.getElementById('progressBar');
            let statusText = document.getElementById('statusText');
            
            let totalTime = 150000; // 150 วินาที (2.5 នាទី)
            let intervalTime = 1000; // ធ្វើបច្ចុប្បន្នភាពរាល់ 1 វិនាទី
            let increment = 100 / (totalTime / intervalTime);

            let timer = setInterval(function() {
                if (width >= 98) {
                    clearInterval(timer);
                    statusText.innerText = "ជិតរួចរាល់ហើយ សូមរង់ចាំបន្តិចសន្ធឹក...";
                } else {
                    width += increment;
                    progressBar.style.width = width + '%';
                    let currentSec = Math.floor((width / 100) * (totalTime / 1000));
                    statusText.innerText = `ដំណើរការ ${Math.floor(width)}% (រង់ចាំប្រហែល ២-៣ នាទី)`;
                }
            }, intervalTime);
        };
    </script>
</body>
</html>
