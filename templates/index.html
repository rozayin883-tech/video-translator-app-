<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Translator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 { font-size: 20px; margin-bottom: 8px; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
        .upload-box {
            border: 2px dashed #3b82f6;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 16px;
            background: #0f172a;
            display: block;
        }
        input[type="file"] { display: none; }
        button, .download-btn {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        button:hover, .download-btn:hover { background-color: #0369a1; }
        #loadingScreen, #resultScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #334155;
            border-radius: 8px;
            overflow: hidden;
            height: 12px;
            margin: 20px 0 10px 0;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #38bdf8;
            transition: width 0.3s linear;
        }
        #statusText { font-size: 14px; color: #38bdf8; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h2>🎬 បកប្រែវីដេអូ AI</h2>
        <p>ជ្រើសរើសវីដេអូភាសាចិន ដើម្បីបកប្រែជាសំឡេង AI ភាសាខ្មែរ</p>

        <form id="uploadForm" onsubmit="startUpload(event)">
            <label class="upload-box" for="videoFile">
                <span id="fileName">📁 ចុចទីនេះដើម្បីជ្រើសរើសវីដេអូ</span>
                <input type="file" id="videoFile" name="video" accept="video/*" required onchange="handleFileSelect(this)">
            </label>
            <button type="submit" id="submitBtn">ចាប់ផ្តើមបកប្រែ</button>
        </form>
    </div>

    <div class="container" id="loadingScreen">
        <h2>⏳ កំពុងដំណើរការ AI...</h2>
        <p id="statusMsg">កំពុងត្រៀមប្រព័ន្ធបកប្រែ...</p>
        
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div id="statusText">0%</div>
    </div>

    <div class="container" id="resultScreen">
        <h2>🎉 បកប្រែជោគជ័យ!</h2>
        <p>វីដេអូរបស់អ្នកត្រូវបានបកប្រែជាសំឡេង AI ភាសាខ្មែររួចរាល់ហើយ។</p>
        
        <a id="downloadLink" href="#" class="download-btn" download="translated_video.mp4">📥 រក្សាទុកវីដេអូ (Save to Device)</a>
        <button onclick="resetApp()" style="background-color: #334155; margin-top: 10px;">បកប្រែវីដេអូផ្សេងទៀត</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let selectedFile = null;

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                selectedFile = input.files[0];
                document.getElementById('fileName').innerText = "📄 " + selectedFile.name;
            }
        }

        function startUpload(e) {
            e.preventDefault();
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'flex';

            let formData = new FormData();
            formData.append('video', selectedFile);

            fetch('/process', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    pollStatus(data.task_id);
                }
            })
            .catch(err => console.error(err));
        }

        function pollStatus(taskId) {
            let progressBar = document.getElementById('progressBar');
            let statusText = document.getElementById('statusText');
            let statusMsg = document.getElementById('statusMsg');

            let interval = setInterval(function() {
                fetch('/status/' + taskId)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'processing') {
                        progressBar.style.width = data.progress + '%';
                        statusText.innerText = data.progress + '%';
                        if(data.status_msg) statusMsg.innerText = data.status_msg;
                    } else if (data.status === 'completed') {
                        clearInterval(interval);
                        progressBar.style.width = '100%';
                        document.getElementById('loadingScreen').style.display = 'none';
                        document.getElementById('resultScreen').style.display = 'flex';
                        
                        document.getElementById('downloadLink').href = '/download/' + data.output_file;
                    } else if (data.status === 'error') {
                        clearInterval(interval);
                        alert('เกิดข้อผิดพลาด: ' + data.status_msg);
                        resetApp();
                    }
                })
                .catch(err => console.error(err));
            }, 3000);
        }

        function resetApp() {
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'flex';
            document.getElementById('uploadForm').reset();
            document.getElementById('fileName').innerText = "📁 ចុចទីនេះដើម្បីជ្រើសរើសវីដេអូ";
        }
    </script>
</body>
</html>
